name: _89_secondstufff
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Networking & API
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.0

  # Database
  supabase_flutter: ^2.5.1
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utilities
  flutter_svg: ^2.0.10+1
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Location & Maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2

  # Payment & Utils
  midtrans_sdk: ^1.2.0
  url_launcher: ^6.2.5
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/icon5.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/icon5.png"
  min_sdk_android: 21
  remove_alpha_channel_android: true
  adaptive_icon_background: "#1A0F2E"
  adaptive_icon_foreground: "assets/logo/icon5.png"